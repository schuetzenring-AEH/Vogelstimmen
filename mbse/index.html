<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#121a14" />
  <title>Vogelstimmen — Impact-Analyse</title>
  <link rel="stylesheet" href="css/mbse.css" />
</head>
<body>
  <header class="app-bar">
    <div>
      <h1>Engineering Copilot</h1>
      <div class="sub">Impact-Analyse · Digital Thread · Export</div>
    </div>
    <nav class="tabs" aria-label="Ansichten">
      <button type="button" class="on" data-tab="impact">Impact</button>
      <button type="button" data-tab="audit">Audit</button>
      <button type="button" data-tab="export">Export</button>
    </nav>
    <a class="btn" href="presentation.html">Präsentation</a>
    <a class="btn" href="../showcase/index.html#/copilot">Showcase</a>
  </header>

  <div class="layout" id="view-impact">
    <aside class="side">
      <input class="search" id="req-search" type="search" placeholder="Requirement suchen…" autocomplete="off" />
      <div class="req-list" id="req-list"></div>
    </aside>
    <section class="main-pane">
      <div class="toolbar">
        <div class="whatif" id="whatif"></div>
        <label class="mono" style="font-size:0.75rem;color:var(--muted)">
          <input type="checkbox" id="list-mode" /> Listenansicht
        </label>
        <div class="legend">
          <span><i class="dot red"></i>direkt betroffen</span>
          <span><i class="dot yellow"></i>Review / transitiv</span>
          <span><i class="dot green"></i>unverändert</span>
        </div>
      </div>
      <div id="cy" aria-label="Wirkungskette"></div>
      <div class="list-view" id="list-view"></div>
    </section>
    <aside class="side side-right detail" id="detail">
      <p class="note">Requirement wählen — Wirkungskette und What-if erscheinen hier.</p>
    </aside>
  </div>

  <div class="panel-page" id="view-audit"></div>
  <div class="panel-page" id="view-export"></div>

  <script src="https://cdn.jsdelivr.net/npm/cytoscape@3.30.2/dist/cytoscape.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
